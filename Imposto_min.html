<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Simulador Tributação 10% Imposto Mínimo</title>

<style>
body{
    font-family:Arial;
    background:linear-gradient(135deg,#020617,#062e18);
    color:#AB2507;
    padding:40px;
}
.container{max-width:900px;margin:auto}
h1{color:#3FA110}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.box{
    background:rgba(63,161,16,0.15);
    backdrop-filter:blur(10px);
    border-radius:14px;
    padding:15px;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:none;
    border-radius:10px;
    font-size:16px;
    background:#020617;
    color:#ecfdf5;
}

button{
    margin-top:20px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#3FA110;
    color:#022c22;
    font-size:16px;
    cursor:pointer;
}

.result{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:rgba(200,1,1,0.5));
}

.ok{color:#22c55e}
.warn{color:#fde047}
</style>
</head>

<body>

<div class="container">

<h1>Simulador Tributação Mínima</h1>

<div class="grid">

<div class="box">
<label>Salário/Pró-labore</label>
<input id="salario">
</div>

<div class="box">
<label>Total de Aplicações</label>
<input id="financeiros">
</div>

<div class="box">
<label>Dividendos</label>
<input id="dividendos">
</div>

<div class="box">
<label>Aplicação em Produtos Isentos (LCI/LCA)</label>
<input id="isentos">
</div>

<div class="box">
<label>Total de IR Pago</label>
<input id="irPago">
</div>

<div class="box">
<label>Alíquota (%)</label>
<input type="number" id="aliquota" value="10">
</div>

</div>

<button onclick="calcular()">Calcular</button>

<div class="result" id="resultado" style="display:none">

<p>Total: <b id="total"></b></p>
<p>Base: <b id="base"></b></p>
<p>IR mínimo: <b id="irMin"></b></p>
<p>IR pago: <b id="irPagoOut"></b></p>
<p>Complementar: <b id="irComp"></b></p>
<p>IR dividendos: <b id="irDiv"></b></p>
<p>Final: <b id="final"></b></p>

<p id="status"></p>

</div>

</div>

<script>

// formatador
const fmt = new Intl.NumberFormat('pt-BR',{
    style:'currency',
    currency:'BRL'
});

// máscara confiável
function mask(input){
    input.value = 'R$ 0,00';
    input.dataset.valor = 0;

    input.addEventListener('input', () => {
        let v = input.value.replace(/\D/g,'');

        if(v === '') v = '0';

        let numero = parseInt(v);

        input.dataset.valor = numero;

        input.value = fmt.format(numero / 100);
    });
}

// aplicar
['salario','financeiros','dividendos','isentos','irPago'].forEach(id=>{
    mask(document.getElementById(id));
});

// pegar valor real
function get(id){
    return Number(document.getElementById(id).dataset.valor)/100;
}

// cálculo
function calcular(){

    const salario = get('salario');
    const financeiros = get('financeiros');
    const dividendos = get('dividendos');
    const isentos = get('isentos');
    const irPago = get('irPago');
    const aliq = Number(document.getElementById('aliquota').value)/100;

    const total = salario + financeiros + dividendos;

    const base = Math.max(total - isentos, 0);

    const irMin = base * aliq;

    const irComp = Math.max(irMin - irPago, 0);

    const irDiv = dividendos * aliq;

    const final = irComp - irDiv;

    totalOut.innerText = fmt.format(total);
    baseOut.innerText = fmt.format(base);
    irMinOut.innerText = fmt.format(irMin);
    irPagoOut.innerText = fmt.format(irPago);
    irCompOut.innerText = fmt.format(irComp);
    irDivOut.innerText = fmt.format(irDiv);
    finalOut.innerText = fmt.format(final);

    if(irComp > 0){
        status.innerText = "⚠ Atinge imposto mínimo";
        status.className = "warn";
    } else {
        status.innerText = "✔ Não atinge imposto mínimo";
        status.className = "ok";
    }

    resultado.style.display = 'block';
}

// refs
const totalOut = document.getElementById('total');
const baseOut = document.getElementById('base');
const irMinOut = document.getElementById('irMin');
const irPagoOut = document.getElementById('irPagoOut');
const irCompOut = document.getElementById('irComp');
const irDivOut = document.getElementById('irDiv');
const finalOut = document.getElementById('final');
const status = document.getElementById('status');
const resultado = document.getElementById('resultado');

</script>

</body>
</html>
